name: MebLap
options:
  bundleIdPrefix: com.meblap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MebLap:
    type: application
    platform: iOS
    sources:
      - path: MebLap
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meblap.app
        PRODUCT_NAME: MebLap
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: MebLap/Info.plist
      properties:
        CFBundleDisplayName: MebLap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: "MebLap uses your location to show you on the map, give turn-by-turn directions and warn you about road hazards reported ahead."
        NSLocationAlwaysAndWhenInUseUsageDescription: "MebLap uses your location during navigation, including when the screen is locked, so voice guidance keeps working."
        LSApplicationQueriesSchemes:
          - whatsapp
          - comgooglemaps
schemes:
  MebLap:
    build:
      targets:
        MebLap: all
    run:
      config: Debug
    archive:
      config: Release
